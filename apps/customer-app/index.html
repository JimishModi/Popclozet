<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6366f1" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob: https:; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; connect-src 'self' https:; font-src 'self' https: data:; frame-src 'self' https:;">
  <!-- Security: CSP is applied via HTTP headers in production, not here in dev -->
  <!-- Additional browser security headers -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy"
    content="geolocation=(self), camera=(), microphone=(), payment=(self), fullscreen=(self)" />
  <title>PopClozet - Premium Fashion Rental | Delivered in 60 Minutes</title>
  <meta name="description"
    content="Rent designer fashion for every occasion. PopClozet delivers premium outfits in 60 minutes. Affordable, sustainable, and stylish. Browse 500+ trending pieces." />
  <meta name="keywords"
    content="fashion rental, designer clothes, rent outfits, sustainable fashion, quick delivery, online wardrobe" />
  <meta name="author" content="PopClozet" />

  <!-- ---------------------------------------------------------
         FORCE LIGHT THEME ON FIRST LOAD (IMPORTANT)
       --------------------------------------------------------- -->
  <script>
    (function () {
      try {
        const saved = localStorage.getItem("theme");

        if (saved === "dark") {
          // User explicitly selected dark → respect it
          document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-theme", "dark");
          return;
        }

        // Default → LIGHT mode
        document.documentElement.classList.remove("dark");
        document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {
        console.warn("Theme load error", e);
      }
    })();
  </script>
  <!-- --------------------------------------------------------- -->

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Bebas+Neue&display=swap"
    rel="stylesheet">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="PopClozet - Premium Fashion Rental Delivered in 60 Minutes" />
  <meta property="og:description"
    content="Rent designer fashion for every occasion. Delivered to your door in just 60 minutes. Join 10,000+ happy customers." />
  <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PopClozet - Premium Fashion Rental" />
  <meta name="twitter:description"
    content="Designer outfits delivered in 60 minutes. Affordable, sustainable, stylish." />
  <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
