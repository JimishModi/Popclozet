<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- Prevent white flash on iOS PWA before React/CSS mounts -->
  <style>
    html,
    body {
      background-color: #0a0a0a;
      margin: 0
    }
  </style>
  <meta name="apple-mobile-web-app-title" content="PopClozet" />
  <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https: https://verify.msg91.com https://checkout.razorpay.com https://*.mappls.com https://*.mapmyindia.com;
        worker-src 'self' blob:;
        style-src 'self' 'unsafe-inline' https: https://fonts.googleapis.com https://api.mapbox.com https://*.mappls.com https://*.mapmyindia.com;
        img-src 'self' data: blob: https: http: https://*.mappls.com https://*.mapmyindia.com;
        font-src 'self' https: data: https://fonts.gstatic.com;
        connect-src 'self' http://localhost:3001 https://*.supabase.co wss://*.supabase.co https://*.mapbox.com https://nominatim.openstreetmap.org https://api.ipify.org https://verify.msg91.com https://control.msg91.com https://api.razorpay.com https://lumberjack.razorpay.com https://atlas.mappls.com https://apis.mapmyindia.com https://*.mapmyindia.com https://*.mappls.com;
        frame-src 'self' https: https://api.razorpay.com https://checkout.razorpay.com;
        base-uri 'self';
        form-action 'self';
      " />
  <!-- Security: CSP is applied via HTTP headers in production, not here in dev -->
  <!-- Additional browser security headers -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy"
    content="geolocation=(self), camera=(), microphone=(), payment=(self), fullscreen=(self)" />
  <title>Popclozet - Premium Fashion Rental | Delivered in 60 Minutes</title>
  <meta name="description"
    content="Rent designer fashion for every occasion. Popclozet delivers premium outfits in 60 minutes. Affordable, sustainable, and stylish. Browse 500+ trending pieces." />
  <meta name="keywords"
    content="fashion rental, designer clothes, rent outfits, sustainable fashion, quick delivery, online wardrobe" />
  <meta name="author" content="Popclozet" />

  <!-- ---------------------------------------------------------
         FORCE LIGHT THEME ON FIRST LOAD (IMPORTANT)
       --------------------------------------------------------- -->
  <script>
    (function () {
      try {
        const saved = localStorage.getItem("popclozet-theme");

        if (saved === "dark") {
          // User explicitly selected dark → respect it
          document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-theme", "dark");
          return;
        }

        // Default → LIGHT mode
        document.documentElement.classList.remove("dark");
        document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {
        console.warn("Theme load error", e);
      }
    })();
  </script>
  <!-- --------------------------------------------------------- -->

  <!-- Preconnect to Supabase (images, API) — eliminates DNS + TLS on first request -->
  <link rel="preconnect" href="https://hfcdvcpgpkdgmcakgiuy.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://hfcdvcpgpkdgmcakgiuy.supabase.co">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Bebas+Neue&display=swap"
    rel="stylesheet">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Popclozet - Premium Fashion Rental Delivered in 60 Minutes" />
  <meta property="og:description"
    content="Rent designer fashion for every occasion. Delivered to your door in just 60 minutes. Join 10,000+ happy customers." />
  <meta property="og:image" content="https://popclozet.in/icons/icon-512x512.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Popclozet - Premium Fashion Rental" />
  <meta name="twitter:description"
    content="Designer outfits delivered in 60 minutes. Affordable, sustainable, stylish." />
  <meta name="twitter:image" content="https://popclozet.in/icons/icon-512x512.png" />
  <!-- Mapbox GL JS CSS -->

</head>

<body>
  <!-- Fallback loading UI — visible until React mounts (prevents blank white on iOS) -->
  <div id="__boot"
    style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:#0a0a0a;z-index:99999;font-family:'DM Sans',system-ui,sans-serif">
    <div
      style="width:36px;height:36px;border-radius:50%;border:3px solid rgba(242,84,109,0.15);border-top-color:#f2546d;animation:__spin .7s linear infinite">
    </div>
    <style>
      @keyframes __spin {
        to {
          transform: rotate(360deg)
        }
      }
    </style>
  </div>
  <div id="root"></div>

  <!-- Global crash handler — if JS fails entirely, show recovery UI -->
  <script>
    (function () {
      window.__popclozetRecover = function () {
        var clearCaches = window.caches
          ? caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) {
              return caches.delete(key);
            }));
          })
          : Promise.resolve();

        clearCaches.finally(function () {
          location.reload();
        });
      };

      function renderBootError(message) {
        var boot = document.getElementById('__boot');
        if (!boot) return;

        boot.innerHTML = '<p style="color:#fff;font-size:16px;font-weight:700;margin:0">Something went wrong</p>'
          + '<p style="color:#71717a;font-size:13px;text-align:center;max-width:280px;margin:8px 0 0">' + message + '</p>'
          + '<button onclick="window.__popclozetRecover()" style="margin-top:16px;padding:12px 28px;border-radius:14px;background:#f2546d;color:#fff;font-weight:700;font-size:14px;border:none;cursor:pointer">Clear Cache & Reload</button>';
      }

      window.addEventListener('error', function (event) {
        renderBootError(event.message || 'The app could not load.');
      });

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var message = (reason && reason.message) || (typeof reason === 'string' ? reason : 'The app could not load.');
        renderBootError(message);
      });
    })();
  </script>

  <!-- Razorpay Payment SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
