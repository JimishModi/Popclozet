  <!-- ─────────────────────────────────────────────────────────────
       AGGRESSIVE SERVICE WORKER KILL-SWITCH (localhost / dev only)
       ─────────────────────────────────────────────────────────────
       VitePWA is disabled in dev, but previously-installed service
       workers keep serving cached bundles until explicitly removed.
       This script unregisters every existing SW and nukes the Cache
       Storage on localhost so fresh JS is always fetched.
  -->
  <script>
    (function () {
      try {
        var host = window.location.hostname;
        var isLocal =
          host === 'localhost' ||
          host === '127.0.0.1' ||
          host === '0.0.0.0' ||
          host === '::1' ||
          /^192\.168\./.test(host) ||
          /^10\./.test(host) ||
          host.endsWith('.local');

        if (isLocal && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              // Preserve the dev push-testing SW (dev-sw.js). Only kill
              // production/VitePWA-style workers that were cached locally.
              var scriptURL =
                (reg.active && reg.active.scriptURL) ||
                (reg.installing && reg.installing.scriptURL) ||
                (reg.waiting && reg.waiting.scriptURL) ||
                '';
              if (scriptURL.indexOf('/dev-sw.js') !== -1) {
                return;
              }
              reg.unregister().then(function (ok) {
                console.log('[SW-KILL] unregistered:', reg.scope, ok);
              });
            });
          }).catch(function (e) {
            console.warn('[SW-KILL] getRegistrations failed:', e);
          });

          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              keys.forEach(function (key) {
                caches.delete(key).then(function (ok) {
                  console.log('[SW-KILL] cache deleted:', key, ok);
                });
              });
            }).catch(function (e) {
              console.warn('[SW-KILL] caches.keys failed:', e);
            });
          }
        }
      } catch (e) {
        console.warn('[SW-KILL] failed:', e);
      }
    })();
  </script>

  <!-- ---------------------------------------------------------
         FORCE LIGHT THEME ON FIRST LOAD (IMPORTANT)
       --------------------------------------------------------- -->
  <script>
    (function () {
      try {
        const saved = localStorage.getItem("popclozet-theme");

        if (saved === "dark") {
          // User explicitly selected dark → respect it
          document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-theme", "dark");
          return;
        }

        // Default → LIGHT mode
        document.documentElement.classList.remove("dark");
        document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {
        console.warn("Theme load error", e);
      }
    })();
  </script>

  <!-- Fallback loading UI — visible until React mounts (prevents blank white on iOS) -->
  <div id="__boot"
    style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:#0a0a0a;z-index:99999;font-family:'DM Sans',system-ui,sans-serif">
    <div
      style="width:36px;height:36px;border-radius:50%;border:3px solid rgba(242,84,109,0.15);border-top-color:#f2546d;animation:__spin .7s linear infinite">
    </div>
    <style>
      @keyframes __spin {
        to {
          transform: rotate(360deg)
        }
      }
    </style>
  </div>
  <div id="root"></div>

  <!-- Global crash handler — if JS fails entirely, show recovery UI -->
  <script>
    (function () {
      window.__popclozetRecover = function () {
        var clearCaches = window.caches
          ? caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) {
              return caches.delete(key);
            }));
          })
          : Promise.resolve();

        clearCaches.finally(function () {
          location.reload();
        });
      };

      function renderBootError(message) {
        var boot = document.getElementById('__boot');
        if (!boot) return;

        boot.innerHTML = '<p style="color:#fff;font-size:16px;font-weight:700;margin:0">Something went wrong</p>'
          + '<p style="color:#71717a;font-size:13px;text-align:center;max-width:280px;margin:8px 0 0">' + message + '</p>'
          + '<button onclick="window.__popclozetRecover()" style="margin-top:16px;padding:12px 28px;border-radius:14px;background:#f2546d;color:#fff;font-weight:700;font-size:14px;border:none;cursor:pointer">Clear Cache & Reload</button>';
      }

      window.addEventListener('error', function (event) {
        renderBootError(event.message || 'The app could not load.');
      });

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var message = (reason && reason.message) || (typeof reason === 'string' ? reason : 'The app could not load.');
        renderBootError(message);
      });
    })();
  </script>
