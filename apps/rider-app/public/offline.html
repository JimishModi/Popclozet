<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline mode - Popclozet Rider</title>
    <style>
      :root {
        --bg: #0b0b0c;
        --surface: #121214;
        --border: #1f1f23;
        --primary: #8855F7;
        --text: #ffffff;
        --muted: #a1a1aa;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrapper {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: linear-gradient(180deg, rgba(18,18,20,0.92), rgba(11,11,12,0.92));
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.55);
        backdrop-filter: blur(6px);
      }
      .badge {
        display: inline-block;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        border-radius: 999px;
        background: rgba(136,85,247,0.14);
        color: var(--primary);
        margin-bottom: 16px;
      }
      h1 { font-size: 22px; font-weight: 600; margin: 0 0 12px; }
      p { font-size: 14px; line-height: 1.6; color: var(--muted); margin: 0 0 24px; }
      .actions { display: grid; gap: 12px; }
      .primary-btn {
        height: 48px;
        border-radius: 12px;
        border: none;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
      }
      .secondary-btn {
        height: 48px;
        border-radius: 12px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 14px;
        cursor: pointer;
      }
      .footer { margin-top: 20px; text-align: center; font-size: 12px; color: #6b7280; }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="card">
        <span class="badge">Offline mode</span>
        <h1>You're offline</h1>
        <p>
          No internet connection detected. Delivery updates and navigation
          will resume once connectivity is restored. Previously loaded data
          is still available.
        </p>
        <div class="actions">
          <button class="primary-btn" onclick="location.reload()">Retry connection</button>
          <button class="secondary-btn" onclick="location.href='/'">Return to home</button>
        </div>
        <div class="footer">Popclozet Rider - Offline</div>
      </div>
    </div>
  </body>
</html>
